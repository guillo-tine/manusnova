      <main style="max-width:640px;margin:0 auto;padding:48px 24px;font-family:Arial,sans-serif;color:#f5f5f7;background:#000">
        <h1>Manus Nova: prosthetic hands, printed and given away.</h1>
        <p>Manus Nova is a student nonprofit in the Bronx, New York. We print, assemble, and fit prosthetic hands and give them away at no cost to the person who wears them.</p>
        <h2>Designed, tested, and printed by us.</h2>
        <p>Every device we build is our own design, tested against our own quality standards before anyone receives one. We print every piece, assemble it by hand, and fit it in person.</p>
        <h2>Our mission</h2>
        <p>A working hand shouldn't depend on what you can afford. A conventional prosthetic hand can cost thousands of dollars; Manus Nova started in 2023 as a group of students in the Bronx who wanted to change that. So far we have built and given away 35 hands.</p>
        <h2>How it works</h2>
        <ol>
          <li>Request: tell us who the hand is for. A student replies within a day or two.</li>
          <li>Fitting: we meet in person and take measurements. Fittings are always free.</li>
          <li>Build: we print every part, assemble it by hand, and check it against our standards, in two to four weeks.</li>
          <li>Delivery: we fit the finished hand in person. It's yours to keep, at no cost.</li>
        </ol>
        <h2>Free to the person who wears it</h2>
        <p>Materials run about $30 a hand. Donations cover that, so the recipient never pays.</p>
        <h2>Request a device</h2>
        <p>Email <a href="mailto:teammanusnova@gmail.com">teammanusnova@gmail.com</a>. A student replies within a day or two; fittings are free, and a build takes two to four weeks.</p>
      </main>
